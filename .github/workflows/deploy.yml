name: Deploy to GitHub Pages

# Auto-deploy on every push to main, plus a manual "Run workflow" button
# in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed for peaceiris/actions-gh-pages to push the build output back to
# the gh-pages branch using the workflow's own GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Don't keep stale files from previous deploys.
          force_orphan: true
