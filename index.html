      href="https://fonts.googleapis.com/css2?family=Anton&family=Big+Shoulders+Display:wght@600;700;800;900&family=JetBrains+Mono:wght@100;200;300;400;500&family=Oswald:wght@200;300;400;500&display=swap"

    <link rel="preload" href="%BASE_URL%fonts/T1Korium-2Kg.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="preload" href="%BASE_URL%fonts/T1Korium-4Kg.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // SPA fallback — 404.html rewrites the URL into ?/route format; this
      // restores it so React Router sees the real path.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
